name: Build and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Only the default branch publishes releases
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      - name: Publish release
        env:
          # Set a RELEASE_TOKEN secret (a raager09 personal access token) to publish as raager09
          # instead of github-actions[bot].
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          tag="$(grep '^mod_version=' gradle.properties | cut -d= -f2)-$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          jar="$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')"
          # Same version pushed again: replace the release so its tag and jar match the latest commit
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" $jar --title "$tag" --target "$GITHUB_SHA" --generate-notes
